name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the API (so dashboard tests exercise the real thing instead of skipping)
        run: |
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || (cat /tmp/uvicorn.log && exit 1)

      - name: Run the test suite
        run: python3 -m pytest tests/ -v

      - name: Score the copilot intent-routing eval
        run: python3 governance/evals.py
